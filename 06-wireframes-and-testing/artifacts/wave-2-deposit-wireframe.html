<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>وایرفریم موج ۲ — واریز به کیف پول شمش</title>
  <style>
    @font-face {
      font-family: "Yekan Bakh";
      src: url("../../07-design-system/legacy-brand/typogaphy/YekanBakh3%20-%20Pro%20%20Plus/Yekan%20Bakh%20Variable/webfonts/YekanBakhFaNum-VF.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --canvas: #eef0f2;
      --surface: #fff;
      --surface-subtle: #f7f8f9;
      --surface-strong: #eef1f3;
      --text: #17191c;
      --text-secondary: #626870;
      --border: #d7dbe0;
      --border-strong: #aeb4bc;
      --primary: #1d2530;
      --primary-pressed: #0e1217;
      --accent: #876f2c;
      --accent-soft: #f5f0df;
      --focus: #1d64d8;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --warning: #8a5a00;
      --warning-bg: #fff8e7;
      --success: #18794e;
      --success-bg: #edf8f2;
      --info-bg: #f1f4f7;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow: 0 18px 60px rgba(26,31,38,.13);
      --phone-width: 390px;
      font-family: "Yekan Bakh", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      background: var(--canvas);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 30%, transparent);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; }
    .skip-link {
      position: fixed;
      inset-inline-start: 12px;
      top: -60px;
      z-index: 100;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
    }
    .skip-link:focus { top: 12px; }

    .workspace {
      min-height: 100dvh;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: var(--phone-width) minmax(280px, 360px);
      align-items: center;
      justify-content: center;
      gap: 32px;
      direction: ltr;
    }
    .phone, .prototype-panel { direction: rtl; }
    .phone {
      width: var(--phone-width);
      max-width: 100%;
      height: min(844px, calc(100dvh - 48px));
      min-height: 680px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 28px minmax(0,1fr);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: relative;
      transition: width 180ms ease;
    }
    .phone.is-small { width: 320px; }
    .device-status {
      padding: 4px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid #f0f1f2;
      background: #fff;
    }
    .device-icons { display: flex; gap: 5px; align-items: center; }
    .device-icons span { display: block; background: #3b4148; border-radius: 2px; }
    .device-icons .signal { width: 16px; height: 9px; clip-path: polygon(0 100%,0 70%,20% 70%,20% 52%,40% 52%,40% 35%,60% 35%,60% 18%,80% 18%,80% 0,100% 0,100% 100%); }
    .device-icons .battery { width: 17px; height: 9px; border: 1.5px solid #3b4148; background: transparent; }

    .app {
      min-height: 0;
      display: grid;
      grid-template-rows: 64px minmax(0,1fr) auto;
      background: var(--surface);
    }
    .app-header {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      min-height: 64px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.97);
      z-index: 5;
    }
    .app-header h1 {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 760;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: var(--text);
      transition: background-color 160ms ease;
    }
    .icon-button:hover { background: var(--surface-subtle); }
    .icon-button:active { background: var(--surface-strong); }
    .icon-button svg, .inline-icon svg, .method-icon svg, .result-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .content {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 16px 32px;
      scrollbar-width: thin;
    }
    .content:focus { outline: none; }
    .action-bar {
      padding: 10px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.98);
      box-shadow: 0 -8px 24px rgba(26,31,38,.08);
      z-index: 6;
    }
    .action-bar[hidden] { display: none; }
    .screen-head { margin-bottom: 20px; }
    .screen-head h2 { margin: 0 0 6px; font-size: 23px; line-height: 1.4; font-weight: 800; }
    .screen-head p { margin: 0; color: var(--text-secondary); font-size: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      padding: 16px;
    }
    .wallet-summary {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface-subtle);
    }
    .wallet-summary span { color: var(--text-secondary); font-size: 13px; }
    .wallet-summary strong { display: block; margin-top: 2px; font-size: 17px; }
    .wallet-mark { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .field { margin-bottom: 16px; }
    .field-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 14px; font-weight: 720; }
    .field-label small { color: var(--text-secondary); font-weight: 500; }
    .input-wrap { position: relative; }
    .money-input, .text-input, .select-input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      padding: 0 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .money-input { direction: ltr; text-align: right; padding-inline-end: 72px; font-size: 18px; font-weight: 720; }
    .money-input:focus, .text-input:focus, .select-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,37,48,.08); outline: 0; }
    .input-unit { position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 13px; pointer-events: none; }
    .helper { margin: 7px 0 0; font-size: 12px; color: var(--text-secondary); }
    .field-error { margin: 7px 0 0; color: var(--danger); font-size: 13px; font-weight: 650; }
    .quick-amounts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
    .chip {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .chip:hover, .chip:active { background: var(--surface-subtle); border-color: var(--border-strong); }
    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--info-bg);
      color: var(--text-secondary);
      font-size: 13px;
    }
    .notice.warning { background: var(--warning-bg); color: var(--warning); }
    .notice.danger { background: var(--danger-bg); color: var(--danger); }
    .notice.success { background: var(--success-bg); color: var(--success); }
    .notice strong { display: block; color: inherit; margin-bottom: 2px; }
    .inline-icon { flex: 0 0 auto; margin-top: 1px; }

    .method-list { display: grid; gap: 10px; }
    .method-card {
      width: 100%;
      min-height: 86px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      padding: 13px;
      display: grid;
      grid-template-columns: 42px minmax(0,1fr) 24px;
      align-items: center;
      gap: 11px;
      text-align: right;
      transition: border-color 160ms ease, background-color 160ms ease;
    }
    .method-card:hover:not(:disabled) { background: var(--surface-subtle); border-color: var(--border-strong); }
    .method-card[aria-checked="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .method-card:disabled { opacity: .58; cursor: not-allowed; }
    .method-icon { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-strong); display: grid; place-items: center; color: var(--primary); }
    .method-copy { min-width: 0; }
    .method-title-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .method-copy strong { font-size: 15px; }
    .method-copy span { display: block; margin-top: 3px; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
    .badge { display: inline-flex !important; width: fit-content; margin: 0 !important; padding: 3px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent) !important; font-size: 11px !important; font-weight: 750; }
    .radio-dot { width: 20px; height: 20px; border: 2px solid var(--border-strong); border-radius: 50%; display: grid; place-items: center; }
    .method-card[aria-checked="true"] .radio-dot { border-color: var(--primary); }
    .method-card[aria-checked="true"] .radio-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .method-more {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 680;
    }
    .summary-list { display: grid; margin-top: 16px; border-top: 1px solid var(--border); }
    .summary-row { min-height: 48px; padding: 11px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); }
    .summary-row span { color: var(--text-secondary); font-size: 13px; }
    .summary-row strong { text-align: left; font-size: 14px; }
    .source-card {
      width: 100%;
      min-height: 62px;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-align: right;
    }
    .source-card strong { display: block; font-size: 14px; }
    .source-card span { display: block; color: var(--text-secondary); font-size: 12px; direction: ltr; text-align: right; }
    .bank-info { margin-top: 16px; }
    .copy-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-subtle); }
    .copy-row + .copy-row { margin-top: 8px; }
    .copy-row small { display: block; color: var(--text-secondary); }
    .copy-row strong { display: block; margin-top: 3px; direction: ltr; text-align: right; font-size: 14px; overflow-wrap: anywhere; }
    .copy-button { width: 48px; height: 48px; border: 0; border-radius: 12px; background: #fff; color: var(--text); display: grid; place-items: center; }

    .primary-button, .secondary-button, .danger-button {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-md);
      padding: 0 16px;
      font-weight: 760;
      transition: background-color 160ms ease, opacity 160ms ease;
    }
    .primary-button { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
    .primary-button:hover:not(:disabled) { background: var(--primary-pressed); }
    .primary-button:disabled { opacity: .42; }
    .secondary-button { border: 1px solid var(--border-strong); background: #fff; color: var(--text); }
    .secondary-button:hover { background: var(--surface-subtle); }
    .text-button { min-height: 48px; border: 0; background: transparent; color: var(--text); font-weight: 700; padding: 8px; }
    .button-stack { display: grid; gap: 8px; margin-top: 16px; }
    .two-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .result { text-align: center; }
    .result-icon { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--success-bg); color: var(--success); }
    .result-icon.warning { background: var(--warning-bg); color: var(--warning); }
    .result-icon.failed { background: var(--danger-bg); color: var(--danger); }
    .result h2 { margin: 0 0 6px; font-size: 21px; }
    .result > p { margin: 0 auto; color: var(--text-secondary); font-size: 14px; max-width: 30ch; }
    .status-pill { display: inline-flex; margin-bottom: 12px; padding: 4px 9px; border-radius: 999px; background: var(--success-bg); color: var(--success); font-size: 12px; font-weight: 760; }
    .status-pill.warning { background: var(--warning-bg); color: var(--warning); }
    .status-pill.failed { background: var(--danger-bg); color: var(--danger); }
    .result .summary-list { text-align: right; margin-top: 22px; }
    .concept-card { margin-top: 14px; background: var(--warning-bg); border-color: #ead4a5; }
    .concept-card h3 { margin: 0 0 6px; font-size: 16px; }
    .concept-card p { margin: 0; color: var(--warning); font-size: 13px; }

    .empty-state { text-align: center; padding: 36px 12px; }
    .empty-state .result-icon { background: var(--surface-strong); color: var(--text-secondary); }
    .empty-state h2 { margin: 0 0 8px; font-size: 20px; }
    .empty-state p { margin: 0; color: var(--text-secondary); font-size: 14px; }

    .prototype-panel {
      width: 100%;
      padding: 20px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(26,31,38,.08);
    }
    .prototype-panel h2 { margin: 0 0 4px; font-size: 19px; }
    .prototype-panel > p { margin: 0 0 18px; color: var(--text-secondary); font-size: 13px; }
    .control { margin-bottom: 14px; }
    .control label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 720; }
    .control select { width: 100%; min-height: 48px; border: 1px solid var(--border-strong); border-radius: 12px; padding: 0 10px; background: #fff; }
    .check-control { min-height: 48px; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 680; }
    .check-control input { width: 20px; height: 20px; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .panel-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; }
    .toast { position: absolute; inset-inline: 16px; bottom: 88px; z-index: 30; padding: 11px 14px; border-radius: 12px; background: rgba(29,37,48,.96); color: #fff; text-align: center; font-size: 13px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    .modal-root[hidden] { display: none; }
    .modal-root { position: absolute; inset: 28px 0 0; z-index: 20; display: flex; align-items: flex-end; }
    .scrim { position: absolute; inset: 0; border: 0; background: rgba(15,18,22,.52); }
    .sheet { position: relative; width: 100%; max-height: 82%; overflow-y: auto; padding: 8px 16px max(16px,env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: #fff; box-shadow: 0 -16px 44px rgba(15,18,22,.22); }
    .sheet-handle { width: 42px; height: 4px; border-radius: 99px; background: var(--border-strong); margin: 3px auto 14px; }
    .sheet h2 { margin: 0 0 6px; font-size: 19px; }
    .sheet p { margin: 0 0 16px; color: var(--text-secondary); font-size: 13px; }
    .sheet-list { display: grid; gap: 8px; margin-bottom: 14px; }
    .sheet-option { min-height: 58px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: right; }
    .sheet-option strong { display: block; font-size: 14px; }
    .sheet-option span { display: block; color: var(--text-secondary); font-size: 12px; direction: ltr; }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: minmax(0,390px); padding: 12px; }
      .prototype-panel { order: -1; }
      .phone { height: min(844px, calc(100dvh - 24px)); }
    }
    @media (max-width: 430px) {
      .workspace { padding: 0; display: block; }
      .phone { width: 100%; height: 100dvh; min-height: 600px; border: 0; border-radius: 0; box-shadow: none; }
      .prototype-panel { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">رفتن به محتوای اصلی</a>
  <div class="workspace">
    <section class="phone" id="phone" aria-label="پروتوتایپ موبایل واریز به کیف پول شمش">
      <div class="device-status" aria-hidden="true">
        <span>9:41</span>
        <div class="device-icons"><span class="signal"></span><span class="battery"></span></div>
      </div>
      <div class="app">
        <header class="app-header">
          <div id="header-start"></div>
          <h1 id="header-title">واریز به کیف پول</h1>
          <div></div>
        </header>
        <main class="content" id="content" tabindex="-1"></main>
        <div class="action-bar" id="action-bar"></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="modal-root" id="modal-root" hidden>
        <button class="scrim" type="button" data-action="close-sheet" aria-label="بستن پنجره"></button>
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="sheet-handle" aria-hidden="true"></div>
          <h2 id="sheet-title"></h2>
          <p id="sheet-copy"></p>
          <div id="sheet-body"></div>
        </section>
      </div>
    </section>

    <aside class="prototype-panel" aria-label="کنترل‌های پروتوتایپ">
      <h2>واریز ریالی — موج ۲</h2>
      <p>این کنترل‌ها خارج از محصول‌اند و فقط برای تست Stateهای فلو استفاده می‌شوند.</p>
      <div class="control">
        <label for="user-state">حالت کاربر</label>
        <select id="user-state">
          <option value="verified">تأییدشده</option>
          <option value="guest">مهمان</option>
          <option value="unverified">احرازنشده</option>
          <option value="under18">زیر ۱۸ سال</option>
          <option value="restricted">محدودیت حساب</option>
        </select>
      </div>
      <div class="control">
        <label for="entry-context">Context ورود</label>
        <select id="entry-context">
          <option value="wallet">کیف پول / خانه</option>
          <option value="purchase">کمبود موجودی خرید</option>
          <option value="services">خدمات</option>
        </select>
      </div>
      <div class="control">
        <label for="result-state">نتیجه آزمایشی واریز</label>
        <select id="result-state">
          <option value="charged">شارژشده</option>
          <option value="unknown">نتیجه نامشخص</option>
          <option value="failed">ناموفق</option>
          <option value="returned">برگشتی</option>
        </select>
      </div>
      <label class="check-control"><input type="checkbox" id="all-unavailable"> قطعی هم‌زمان همه روش‌ها</label>
      <div class="panel-actions">
        <button class="secondary-button" type="button" id="width-toggle">عرض ۳۲۰px</button>
        <button class="secondary-button" type="button" id="reset-prototype">بازنشانی</button>
      </div>
      <div class="panel-note">مسیر درگاه: مبلغ ← انتقال مستقیم به درگاه ← موفق/ناموفق/نامشخص. روش‌های انتقالی، Gate نقش‌ها، قطعی سراسری و مبلغ بالای ۴۰۰ میلیون جداگانه بررسی می‌شوند.</div>
    </aside>
  </div>

  <script>
    (() => {
      const icons = {
        back: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`,
        wallet: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h13.5A2.5 2.5 0 0 1 20 10v7a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h11"/><path d="M2.5 7.5h14"/><path d="M16 12h4v4h-4a2 2 0 1 1 0-4Z"/></svg>`,
        card: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/></svg>`,
        bank: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-5 9 5M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3 20h18"/></svg>`,
        bridge: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 17v-4c3-5 11-5 14 0v4M8 17v-5M16 17v-5"/></svg>`,
        link: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>`,
        info: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`,
        chevron: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`,
        copy: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>`,
        check: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>`,
        clock: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
        close: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.7 6.7L4 9m16 6-2.7 2.3A7 7 0 0 1 5.5 15"/></svg>`
      };

      const methods = [
        { id:'gateway', name:'درگاه آنلاین', icon:'card', time:'معمولاً فوری؛ حداکثر ۱۵ دقیقه', limit:'سقف از سرویس بانکی', fee:'کارمزد شمش صفر', mode:'handoff' },
        { id:'openbanking', name:'Open Banking', icon:'link', time:'معمولاً فوری؛ حداکثر ۱۵ دقیقه', limit:'از حساب ثبت‌شده شما', fee:'کارمزد شمش صفر', mode:'handoff' },
        { id:'bridge', name:'انتقال پل', icon:'bridge', time:'حداکثر ۳۰ دقیقه', limit:'سقف از سرویس بانکی', fee:'هزینه احتمالی بانک', mode:'handoff' },
        { id:'card', name:'کارت‌به‌کارت', icon:'card', time:'حداکثر ۳۰ دقیقه در ساعات کاری', limit:'تا ۱۵ میلیون تومان', max:15000000, fee:'کارمزد شمش صفر', mode:'evidence' },
        { id:'paya', name:'انتقال پایا', icon:'bank', time:'تا پایان روز یا روز کاری بعد', limit:'تا ۲۰۰ میلیون برای هر دستور', max:200000000, fee:'هزینه احتمالی بانک', mode:'evidence' }
      ];

      const state = {
        view:'amount',
        history:[],
        amount:0,
        amountText:'',
        methodId:'',
        sourceId:'mellat',
        reference:'',
        user:'verified',
        context:'wallet',
        outcome:'charged',
        allUnavailable:false,
        processing:false,
        walletBalance:29300000,
        record:null,
        purchaseAmount:0
      };

      const initialParams = new URLSearchParams(location.search);
      const initialAmount = Number(initialParams.get('amount')) || 0;
      if (initialParams.get('context') === 'purchase') state.context = 'purchase';
      if (initialAmount > 0) {
        state.amount = initialAmount;
        state.amountText = new Intl.NumberFormat('fa-IR').format(initialAmount);
      }
      state.purchaseAmount = Number(initialParams.get('purchaseAmount')) || 0;

      const phone = document.getElementById('phone');
      const content = document.getElementById('content');
      const actionBar = document.getElementById('action-bar');
      const headerTitle = document.getElementById('header-title');
      const headerStart = document.getElementById('header-start');
      const toast = document.getElementById('toast');
      const modalRoot = document.getElementById('modal-root');
      let toastTimer = null;

      const formatNumber = (value) => new Intl.NumberFormat('fa-IR').format(Number(value || 0));
      const parseAmount = (value) => Number(String(value || '').replace(/[^0-9]/g,'')) || 0;
      const currentMethod = () => methods.find(method => method.id === state.methodId) || null;
      const isLarge = () => state.amount > 400000000;
      const hasValidAmount = () => state.amount >= 10000;

      function recommendedMethodId() {
        if (state.amount <= 15000000) return 'gateway';
        if (state.amount <= 200000000) return 'openbanking';
        return 'openbanking';
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function navigate(view, { push=true } = {}) {
        if (push && view !== state.view) state.history.push(state.view);
        state.view = view;
        render();
        requestAnimationFrame(() => content.focus({preventScroll:true}));
      }

      function goBack() {
        if (state.processing) return;
        const previous = state.history.pop();
        if (previous) {
          state.view = previous;
          render();
          return;
        }
        location.href = 'wave-1-app-shell-wireframe.html#home';
      }

      function headerForView() {
        const titles = {
          amount:'واریز به کیف پول', methods:'انتخاب روش واریز', detail:'جزئیات واریز', evidence:'ثبت اطلاعات پرداخت', result:'وضعیت واریز', large:'واریز مبلغ بالا'
        };
        headerTitle.textContent = titles[state.view] || 'واریز به کیف پول';
        headerStart.innerHTML = state.processing ? '' : `<button class="icon-button" type="button" data-action="back" aria-label="بازگشت">${icons.back}</button>`;
      }

      function renderAmount() {
        const error = state.amountText && !hasValidAmount() ? '<p class="field-error" role="alert">حداقل مبلغ واریز ۱۰٬۰۰۰ تومان است.</p>' : '';
        const contextNote = state.context === 'purchase'
          ? `<div class="notice"><span class="inline-icon">${icons.info}</span><div><strong>برای تکمیل خرید وارد شده‌اید</strong>پس از شارژ قطعی، با نرخ تازه به خرید برمی‌گردید.</div></div>`
          : '';
        return `
          <section class="screen-head"><h2>چه مبلغی واریز می‌کنید؟</h2><p>پس از واردکردن مبلغ، روش‌های مناسب را مقایسه کنید.</p></section>
          <section class="wallet-summary card"><div><span>موجودی فعلی کیف پول</span><strong>${formatNumber(state.walletBalance)} تومان</strong></div><span class="wallet-mark inline-icon">${icons.wallet}</span></section>
          <div class="field">
            <label class="field-label" for="deposit-amount"><span>مبلغ واریز</span><small>حداقل ۱۰٬۰۰۰ تومان</small></label>
            <div class="input-wrap"><input class="money-input" id="deposit-amount" inputmode="numeric" autocomplete="off" placeholder="۰" value="${state.amountText}" aria-describedby="amount-help amount-error"><span class="input-unit">تومان</span></div>
            <p class="helper" id="amount-help">شمش برای واریز کارمزدی دریافت نمی‌کند.</p><div id="amount-error">${error}</div>
          </div>
          <div class="quick-amounts" aria-label="مبلغ‌های پیشنهادی">
            ${[1000000,5000000,10000000,50000000].map(amount => `<button class="chip" type="button" data-action="quick-amount" data-amount="${amount}">${formatNumber(amount)}</button>`).join('')}
          </div>
          ${contextNote}
          ${isLarge()?`<section class="concept-card card"><h3>مسیر واریز مبلغ بالا</h3><p>این مبلغ وارد مسیر اختصاصی می‌شود. جزئیات نهایی این مسیر هنوز به یک تصمیم مالی وابسته است و در Prototype قانون قطعی محسوب نمی‌شود.</p></section>`:''}`;
      }

      function renderMethods() {
        if (state.allUnavailable) {
          return `<section class="empty-state"><div class="result-icon">${icons.bank}</div><h2>واریز جدید موقتاً در دسترس نیست</h2><p>در حال حاضر هیچ روش فعالی وجود ندارد. زمان بازگشت تخمینی نمایش نمی‌دهیم؛ واریزهای قبلی همچنان قابل پیگیری‌اند.</p><div class="button-stack"><button class="secondary-button" type="button" data-action="transactions">تاریخچه عملیات</button><button class="text-button" type="button" data-action="support">ارتباط با پشتیبانی</button></div></section>`;
        }
        const recommended = recommendedMethodId();
        return `
          <section class="screen-head"><h2>روش واریز را انتخاب کنید</h2><p>${formatNumber(state.amount)} تومان به کیف پول شما واریز می‌شود.</p></section>
          <div class="method-list" role="radiogroup" aria-label="روش واریز">
            ${methods.map(method => {
              const unavailable = method.max && state.amount > method.max;
              const checked = state.methodId === method.id;
              return `<button class="method-card" type="button" role="radio" aria-checked="${checked}" data-action="select-method" data-method="${method.id}" ${unavailable?'disabled':''}>
                <span class="method-icon">${icons[method.icon]}</span>
                <span class="method-copy"><span class="method-title-line"><strong>${method.name}</strong>${recommended===method.id&&!unavailable?'<span class="badge">پیشنهادی</span>':''}</span><span>${unavailable?`برای این مبلغ قابل استفاده نیست؛ ${method.limit}`:`${method.time} · ${method.limit}`}</span></span>
                <span class="radio-dot" aria-hidden="true"></span>
              </button>`;
            }).join('')}
          </div>
          <button class="method-more" type="button" data-action="method-help"><span>راهنمای مقایسه روش‌ها</span><span class="inline-icon">${icons.chevron}</span></button>
          ${isLarge()?`<button class="concept-card card" style="width:100%;text-align:right" type="button" data-action="open-large"><h3>واریز مبلغ بالا</h3><p>مشاهده چارچوب مسیر اختصاصی؛ جزئیات نهایی وابسته است.</p></button>`:''}`;
      }

      function renderDetail() {
        const method = currentMethod();
        if (!method) return renderMethods();
        const ctaHint = method.mode === 'evidence' ? 'ابتدا اطلاعات مقصد را دریافت می‌کنید و سپس پرداخت را ثبت می‌کنید.' : 'در مرحله بعد به سرویس بانکی منتقل می‌شوید.';
        return `
          <section class="screen-head"><h2>${method.name}</h2><p>${ctaHint}</p></section>
          <section class="card">
            <div class="method-title-line"><span class="method-icon">${icons[method.icon]}</span><div><strong>${method.name}</strong><span style="display:block;color:var(--text-secondary);font-size:12px">${method.time}</span></div></div>
            <div class="summary-list">
              <div class="summary-row"><span>مبلغ واریز</span><strong>${formatNumber(state.amount)} تومان</strong></div>
              <div class="summary-row"><span>کارمزد شمش</span><strong>صفر</strong></div>
              <div class="summary-row"><span>محدودیت روش</span><strong>${method.limit}</strong></div>
            </div>
          </section>
          <button class="source-card" type="button" data-action="source-picker"><span><strong>مبدأ پرداخت</strong><span>بانک ملت · •••• ۶۲۱۱</span></span><span class="inline-icon">${icons.chevron}</span></button>
          <div class="notice" style="margin-top:14px"><span class="inline-icon">${icons.info}</span><div><strong>پرداخت فقط از مبدأ متعلق به شما</strong>واریز از کارت یا حساب شخص دیگر وارد کیف پول نمی‌شود و باید به همان مبدأ برگردد.</div></div>`;
      }

      function renderEvidence() {
        const method = currentMethod();
        const isCard = method?.id === 'card';
        return `
          <section class="screen-head"><h2>اطلاعات پرداخت</h2><p>پرداخت را فقط از مبدأ ثبت‌شده خودتان انجام دهید.</p></section>
          <div class="bank-info">
            <div class="copy-row"><div><small>${isCard?'شماره کارت مقصد':'شبای مقصد'}</small><strong>${isCard?'6037 9918 4000 2145':'IR82 0540 1026 8002 3456 7890 01'}</strong></div><button class="copy-button inline-icon" type="button" data-action="copy" aria-label="کپی ${isCard?'شماره کارت':'شماره شبا'}">${icons.copy}</button></div>
            <div class="copy-row"><div><small>مبلغ دقیق</small><strong>${formatNumber(state.amount)} تومان</strong></div><button class="copy-button inline-icon" type="button" data-action="copy" aria-label="کپی مبلغ">${icons.copy}</button></div>
          </div>
          <div class="field" style="margin-top:18px">
            <label class="field-label" for="reference"><span>شماره پیگیری پرداخت</span><small>پس از پرداخت</small></label>
            <input class="text-input" id="reference" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۱۲۳۴۵۶۷۸" value="${state.reference}">
            <p class="helper">ثبت اطلاعات به معنی شارژ فوری کیف نیست؛ وضعیت پرداخت بررسی می‌شود.</p>
          </div>
          <div class="notice warning"><span class="inline-icon">${icons.clock}</span><div><strong>تا اعلام نتیجه دوباره واریز نکنید</strong>این عملیات با شماره پیگیری در تاریخچه قابل مشاهده خواهد بود.</div></div>`;
      }

      function renderLarge() {
        return `
          <section class="screen-head"><h2>چارچوب واریز مبلغ بالا</h2><p>این بخش برای بررسی ساختار است و قانون مالی نهایی محسوب نمی‌شود.</p></section>
          <div class="notice warning"><span class="inline-icon">${icons.info}</span><div><strong>وابسته به تصمیم مالی</strong>آستانه بیشتر از ۴۰۰ میلیون با سقف روزانه فعلی تعارض دارد؛ تا رفع این تعارض ثبت نهایی فعال نیست.</div></div>
          <section class="card" style="margin-top:14px"><div class="summary-list" style="margin-top:0;border-top:0"><div class="summary-row"><span>روش پیشنهادی فعلی</span><strong>حساب‌به‌حساب</strong></div><div class="summary-row"><span>کنترل مبدأ</span><strong>حساب متعلق به کاربر</strong></div><div class="summary-row"><span>شناسه واریز</span><strong>اختصاصی</strong></div><div class="summary-row"><span>اعتبار درخواست پیشنهادی</span><strong>۲۴ ساعت</strong></div><div class="summary-row"><span>مغایرت</span><strong>بررسی تا یک روز کاری</strong></div></div></section>
          <p class="helper" style="margin-top:12px">مدارک، معافیت احتمالی از سقف و مسئول تأیید پیش از UI نهایی باید قطعی شوند.</p>`;
      }

      function resultConfig() {
        const method = currentMethod() || methods[0];
        const configs = {
          charged:{ pill:'شارژشده', cls:'', icon:icons.check, title:'کیف پول شارژ شد', copy:`${formatNumber(state.amount)} تومان به موجودی قابل استفاده شما اضافه شد.` },
          unknown:{ pill:'نتیجه نامشخص', cls:'warning', icon:icons.clock, title:'نتیجه واریز هنوز مشخص نیست', copy:'اگر مبلغ از حساب بانکی شما کسر شده باشد، حداکثر تا ۷۲ ساعت به همان حساب برمی‌گردد. تا مشخص‌شدن وضعیت دوباره پرداخت نکنید.' },
          failed:{ pill:'ناموفق', cls:'failed', icon:icons.close, title:'واریز انجام نشد', copy:'موجودی کیف پول شما تغییر نکرد. می‌توانید همان مبلغ را با روشی دیگر امتحان کنید.' },
          returned:{ pill:'برگشت وجه', cls:'warning', icon:icons.refresh, title:'وجه در مسیر بازگشت به حساب مبدأ است', copy:'این مبلغ وارد کیف پول نشده و حداکثر تا ۷۲ ساعت در همان حساب بانکی مبدأ قابل مشاهده خواهد بود.' }
        };
        return { ...configs[state.outcome], method };
      }

      function renderResult() {
        const config = resultConfig();
        const isCharged = state.outcome === 'charged';
        const statusTime = state.outcome === 'unknown' || state.outcome === 'returned' ? 'حداکثر تا ۷۲ ساعت' : '—';
        return `
          <section class="result">
            <div class="result-icon ${config.cls}">${config.icon}</div><span class="status-pill ${config.cls}">${config.pill}</span>
            <h2>${config.title}</h2><p>${config.copy}</p>
            <div class="summary-list">
              <div class="summary-row"><span>مبلغ</span><strong>${formatNumber(state.amount)} تومان</strong></div>
              <div class="summary-row"><span>روش</span><strong>${config.method.name}</strong></div>
              ${isCharged?`<div class="summary-row"><span>موجودی جدید کیف</span><strong>${formatNumber(state.walletBalance + state.amount)} تومان</strong></div>`:''}
              ${statusTime!=='—'?`<div class="summary-row"><span>زمان مورد انتظار</span><strong>${statusTime}</strong></div>`:''}
              <div class="summary-row"><span>تاریخ</span><strong>۱۷ مرداد ۱۴۰۵، ۲۱:۱۰</strong></div>
              <div class="summary-row"><span>کد پیگیری</span><strong dir="ltr">DP-1405-7421</strong></div>
            </div>
            ${state.outcome==='unknown'?`<div class="notice warning" style="margin-top:16px;text-align:right"><span class="inline-icon">${icons.info}</span><div><strong>پرداخت را تکرار نکنید</strong>نتیجه و کد پیگیری از تاریخچه قابل مشاهده است.</div></div>`:''}
            <div class="button-stack">
              <button class="secondary-button" type="button" data-action="transactions">تاریخچه عملیات</button>
              ${state.outcome==='failed'?'<button class="text-button" type="button" data-action="retry">انتخاب روش دیگر</button>':''}
              ${state.outcome==='returned'?'<button class="text-button" type="button" data-action="support">پیگیری بازگشت وجه</button>':''}
            </div>
          </section>`;
      }

      function renderAction() {
        actionBar.hidden = false;
        if (state.view === 'amount') {
          actionBar.innerHTML = `<button class="primary-button" type="button" data-action="show-methods" ${hasValidAmount()?'':'disabled'}>${isLarge()?'بررسی مسیر مبلغ بالا':'مشاهده روش‌های واریز'}</button>`;
        } else if (state.view === 'methods') {
          if (state.allUnavailable) { actionBar.hidden = true; actionBar.innerHTML=''; return; }
          const gateway=state.methodId==='gateway',label=state.processing?'در حال انتقال به درگاه':gateway?'پرداخت از درگاه':'ادامه با روش انتخاب‌شده';
          actionBar.innerHTML = `<button class="primary-button" type="button" data-action="continue-method" ${state.methodId&&!state.processing?'':'disabled'}>${label}</button>`;
        } else if (state.view === 'detail') {
          const method = currentMethod();
          const label = method?.mode === 'evidence' ? 'مشاهده اطلاعات پرداخت' : state.processing ? 'در حال انتقال به بانک' : 'ادامه و پرداخت';
          actionBar.innerHTML = `<button class="primary-button" type="button" data-action="submit-method" ${state.processing?'disabled':''}>${label}</button>`;
        } else if (state.view === 'evidence') {
          actionBar.innerHTML = `<button class="primary-button" type="button" data-action="submit-evidence" ${state.reference.trim()?'':'disabled'}>${state.processing?'در حال ثبت':'ثبت برای بررسی'}</button>`;
        } else if (state.view === 'result') {
          const label = state.outcome === 'charged' ? (state.context === 'purchase' ? 'بازگشت به خرید با نرخ تازه' : 'مشاهده کیف پول') : state.outcome === 'unknown' ? 'بازگشت به خانه' : state.outcome === 'failed' ? 'تلاش دوباره' : 'بازگشت به خانه';
          const action = state.outcome === 'charged' && state.context === 'purchase' ? 'return-purchase' : state.outcome === 'charged' ? 'wallet' : state.outcome === 'failed' ? 'retry' : 'home';
          actionBar.innerHTML = `<button class="primary-button" type="button" data-action="${action}">${label}</button>`;
        } else if (state.view === 'large') {
          actionBar.innerHTML = `<button class="primary-button" type="button" disabled>ثبت پس از تعیین قانون نهایی</button>`;
        } else {
          actionBar.hidden = true;
          actionBar.innerHTML='';
        }
      }

      function render() {
        headerForView();
        const renders = { amount:renderAmount, methods:renderMethods, detail:renderDetail, evidence:renderEvidence, result:renderResult, large:renderLarge };
        content.innerHTML = (renders[state.view] || renderAmount)();
        renderAction();
      }

      function gateOrContinue(callback) {
        if (state.user === 'verified') return callback();
        const data = {
          guest:['برای ادامه وارد شوید','مشاهده روش‌ها آزاد است؛ ثبت واریز به حساب نیاز دارد.','ورود یا ساخت حساب','wave-1-auth-kyc-wireframe.html'],
          unverified:['احراز هویت لازم است','برای ثبت واریز باید احراز هویت را تکمیل کنید.','تکمیل احراز هویت','wave-1-auth-kyc-wireframe.html?entry=app-shell#kyc'],
          under18:['واریز برای این حساب فعال نیست','عملیات مالی تا رسیدن صاحب حساب به ۱۸ سالگی فعال نمی‌شود.','متوجه شدم','close'],
          restricted:['ثبت واریز محدود شده است','می‌توانید واریزهای قبلی را پیگیری کنید و جزئیات محدودیت را در حساب ببینید.','مشاهده وضعیت حساب','wave-1-app-shell-wireframe.html#account']
        }[state.user];
        openSheet(data[0],data[1],`<button class="primary-button" type="button" data-gate-target="${data[3]}">${data[2]}</button>`);
      }

      function openSheet(title, copy, body) {
        document.getElementById('sheet-title').textContent = title;
        document.getElementById('sheet-copy').textContent = copy;
        document.getElementById('sheet-body').innerHTML = body;
        modalRoot.hidden = false;
        requestAnimationFrame(() => modalRoot.querySelector('button:not(.scrim)')?.focus());
      }
      function closeSheet() { modalRoot.hidden = true; }

      function openMethodHelp() {
        openSheet('مقایسه روش‌های واریز','روش پیشنهادی براساس مبلغ و وضعیت سرویس‌ها انتخاب می‌شود؛ انتخاب نهایی با شماست.',`<div class="summary-list" style="margin:0 0 14px"><div class="summary-row"><span>درگاه / Open Banking</span><strong>حداکثر ۱۵ دقیقه</strong></div><div class="summary-row"><span>پل</span><strong>حداکثر ۳۰ دقیقه</strong></div><div class="summary-row"><span>کارت‌به‌کارت</span><strong>تا ۱۵ میلیون</strong></div><div class="summary-row"><span>پایا</span><strong>تا ۲۰۰ میلیون هر دستور</strong></div></div><div class="notice"><span class="inline-icon">${icons.info}</span><div>شمش کارمزدی دریافت نمی‌کند؛ بانک ممکن است طبق مقررات خودش هزینه‌ای کم کند.</div></div><button class="secondary-button" style="margin-top:14px" type="button" data-action="close-sheet">بستن</button>`);
      }

      function openSourcePicker() {
        openSheet('انتخاب مبدأ پرداخت','فقط کارت یا حساب تأییدشده متعلق به شما قابل استفاده است.',`<div class="sheet-list"><button class="sheet-option" type="button" data-source="mellat"><span><strong>بانک ملت</strong><span>•••• 6211</span></span><span>انتخاب‌شده</span></button><button class="sheet-option" type="button" data-source="melli"><span><strong>بانک ملی</strong><span>•••• 4832</span></span><span>انتخاب</span></button></div><button class="secondary-button" type="button" data-action="add-source">افزودن کارت یا حساب متعلق به خودم</button>`);
      }

      function finishDeposit() {
        state.processing = false;
        state.record = { amount:state.amount, method:state.methodId, outcome:state.outcome };
        navigate('result', {push:false});
      }

      function processDeposit() {
        if (state.processing) return;
        state.processing = true;
        render();
        setTimeout(finishDeposit, 850);
      }

      function reset() {
        Object.assign(state,{view:'amount',history:[],amount:0,amountText:'',methodId:'',sourceId:'mellat',reference:'',processing:false,record:null});
        render();
      }

      document.addEventListener('input', event => {
        if (event.target.id === 'deposit-amount') {
          const raw = event.target.value.replace(/[^0-9]/g,'');
          state.amount = parseAmount(raw);
          state.amountText = raw ? new Intl.NumberFormat('fa-IR').format(state.amount) : '';
          event.target.value = state.amountText;
          const errorRoot = document.getElementById('amount-error');
          if (errorRoot) errorRoot.innerHTML = state.amountText && !hasValidAmount() ? '<p class="field-error" role="alert">حداقل مبلغ واریز ۱۰٬۰۰۰ تومان است.</p>' : '';
          renderAction();
        }
        if (event.target.id === 'reference') {
          state.reference = event.target.value;
          renderAction();
        }
      });

      document.addEventListener('click', event => {
        const trigger = event.target.closest('[data-action]');
        if (!trigger) return;
        const action = trigger.dataset.action;
        const actions = {
          back:goBack,
          'quick-amount':() => { state.amount=Number(trigger.dataset.amount); state.amountText=formatNumber(state.amount); render(); document.getElementById('deposit-amount')?.focus(); },
          'show-methods':() => { if (!hasValidAmount()) return; state.methodId=''; navigate(isLarge()?'large':'methods'); },
          'select-method':() => { state.methodId=trigger.dataset.method; render(); },
          'continue-method':() => gateOrContinue(() => currentMethod()?.id==='gateway' ? processDeposit() : navigate('detail')),
          'method-help':openMethodHelp,
          'source-picker':openSourcePicker,
          'submit-method':() => gateOrContinue(() => currentMethod()?.mode==='evidence' ? navigate('evidence') : processDeposit()),
          'submit-evidence':() => { if (state.reference.trim()) gateOrContinue(processDeposit); },
          'open-large':() => navigate('large'),
          copy:() => showToast('کپی شد'),
          retry:() => { state.reference=''; state.methodId=''; state.history=[]; navigate('methods',{push:false}); },
          wallet:() => location.href='wave-1-app-shell-wireframe.html#home',
          home:() => location.href='wave-1-app-shell-wireframe.html#home',
          'return-purchase':() => location.href=`wave-1-app-shell-wireframe.html?resume=purchase&amount=${state.purchaseAmount || state.amount}&deposited=${state.amount}#trade`,
          transactions:() => location.href='wave-1-app-shell-wireframe.html#transactions',
          support:() => showToast('نقطه تحویل به فلو پشتیبانی'),
          'close-sheet':closeSheet,
          'add-source':() => showToast('نقطه تحویل به ثبت مبدأ بانکی')
        };
        actions[action]?.();
      });

      modalRoot.addEventListener('click', event => {
        const gate = event.target.closest('[data-gate-target]');
        if (gate) {
          const target = gate.dataset.gateTarget;
          if (target === 'close') closeSheet(); else location.href = target;
          return;
        }
        const source = event.target.closest('[data-source]');
        if (source) { state.sourceId=source.dataset.source; closeSheet(); render(); showToast('مبدأ پرداخت انتخاب شد'); }
      });

      document.addEventListener('keydown', event => { if (event.key==='Escape' && !modalRoot.hidden) closeSheet(); });
      document.getElementById('user-state').addEventListener('change', event => { state.user=event.target.value; reset(); });
      document.getElementById('entry-context').addEventListener('change', event => { state.context=event.target.value; reset(); });
      document.getElementById('result-state').addEventListener('change', event => { state.outcome=event.target.value; });
      document.getElementById('all-unavailable').addEventListener('change', event => { state.allUnavailable=event.target.checked; if(state.view==='methods') render(); });
      document.getElementById('width-toggle').addEventListener('click', event => { phone.classList.toggle('is-small'); event.target.textContent = phone.classList.contains('is-small') ? 'عرض ۳۹۰px' : 'عرض ۳۲۰px'; });
      document.getElementById('reset-prototype').addEventListener('click', () => { document.getElementById('user-state').value='verified'; document.getElementById('entry-context').value='wallet'; document.getElementById('result-state').value='charged'; document.getElementById('all-unavailable').checked=false; Object.assign(state,{user:'verified',context:'wallet',outcome:'charged',allUnavailable:false}); reset(); });

      document.getElementById('entry-context').value = state.context;
      render();
    })();
  </script>
</body>
</html>
