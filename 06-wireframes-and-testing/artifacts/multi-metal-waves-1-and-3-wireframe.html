<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>وایرفریم سرتاسری چندفلزی شمش — MM-W0 تا MM-W8</title>
  <style>
    @font-face {
      font-family: "Yekan Bakh";
      src: url("../../07-design-system/legacy-brand/typogaphy/YekanBakh3%20-%20Pro%20%20Plus/Yekan%20Bakh%20Variable/webfonts/YekanBakhFaNum-VF.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --canvas:#eef0f2; --surface:#fff; --subtle:#f6f7f8; --strong:#eceff1;
      --text:#17191c; --muted:#626870; --border:#d6dae0; --border-strong:#aeb4bc;
      --primary:#1d2530; --primary-pressed:#0e1217; --focus:#1d64d8;
      --danger:#a92820; --danger-bg:#fff1f0; --warning:#815600; --warning-bg:#fff8e7;
      --success:#176b47; --success-bg:#edf8f2; --info:#eef3f7;
      --r-sm:10px; --r-md:14px; --r-lg:18px; --shadow:0 18px 60px rgba(26,31,38,.13);
      font-family:"Yekan Bakh",Tahoma,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--canvas)}
    body{margin:0;min-width:320px;min-height:100dvh;background:var(--canvas);color:var(--text);font:16px/1.55 inherit}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent);outline-offset:2px}
    button:active{opacity:.76}
    .skip{position:fixed;inset-inline-start:12px;top:-60px;z-index:1000;background:var(--primary);color:#fff;padding:10px 14px;border-radius:8px}
    .skip:focus{top:12px}
    .workspace{direction:ltr;min-height:100dvh;display:grid;grid-template-columns:minmax(260px,320px) 390px;justify-content:center;align-items:start;gap:28px;padding:28px}
    .review-panel,.phone{direction:rtl;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
    .review-panel{position:sticky;top:28px;border-radius:var(--r-lg);padding:20px;max-height:calc(100dvh - 56px);overflow:auto}
    .review-panel h1{font-size:21px;line-height:1.4;margin:0 0 6px}
    .review-panel p{font-size:13px;color:var(--muted);margin:0 0 16px}
    .wave-label{display:inline-flex;min-height:28px;align-items:center;padding:2px 9px;background:var(--strong);border-radius:999px;font-size:12px;margin-bottom:10px}
    .scenario-list{display:grid;gap:8px}
    .scenario{min-height:48px;text-align:right;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center}
    .scenario span{font-size:12px;color:var(--muted);direction:ltr;text-align:left}
    .scenario strong{font-size:13px;font-weight:650}
    .scenario.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .scenario.active span{color:#d7dbe0}
    .legend{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
    .phone{width:390px;height:820px;border-radius:28px;overflow:hidden;position:relative;display:grid;grid-template-rows:auto 1fr auto}
    .statusbar{height:26px;background:var(--surface);display:flex;align-items:end;justify-content:space-between;padding:0 18px 3px;font-size:10px;direction:ltr}
    .app-header{min-height:58px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 10px;background:var(--surface);z-index:10}
    .app-header h2{font-size:18px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-button{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px}
    .icon-button svg,.nav-item svg,.row-chevron svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .app-main{overflow-y:auto;overscroll-behavior:contain;background:var(--subtle);padding:16px 16px 28px;scrollbar-width:thin}
    .app-main:has(.sticky-action){display:flex;flex-direction:column;padding-bottom:0}
    .bottom-nav{min-height:74px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom));z-index:10}
    .bottom-nav.hidden{display:none}
    .nav-item{min-height:56px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;border-radius:12px}
    .nav-item.active{color:var(--text);background:var(--strong);font-weight:650}
    .section{margin-top:16px}
    .section:first-child{margin-top:0}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .section-head h3{font-size:15px;margin:0}
    .text-button{min-height:44px;border:0;background:transparent;padding:6px;color:var(--primary);font-weight:650}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
    .summary-card{background:var(--primary);color:#fff;border-color:var(--primary);padding:18px}
    .summary-label{font-size:12px;color:#d6d9dd}
    .summary-value{font-size:25px;font-weight:750;line-height:1.4;margin:4px 0;font-variant-numeric:tabular-nums}
    .summary-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#e9ebed}
    .summary-meta strong{color:#fff}
    .portfolio-rail{direction:rtl;display:flex;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;padding:2px 0 8px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
    .portfolio-rail::-webkit-scrollbar{height:4px}
    .portfolio-rail::-webkit-scrollbar-track{background:transparent}
    .portfolio-rail::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
    .portfolio-card{flex:0 0 calc(100% - 42px);min-height:164px;scroll-snap-align:start;scroll-snap-stop:always;border:1px solid var(--border);border-radius:var(--r-md);padding:16px;text-align:right;display:grid;align-content:space-between;gap:14px;background:var(--surface)}
    button.portfolio-card{width:auto;cursor:pointer}
    .portfolio-total{background:var(--primary);border-color:var(--primary);color:#fff}
    .portfolio-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .portfolio-card-title{display:flex;align-items:center;gap:9px;min-width:0}
    .portfolio-card-title .metal-symbol{width:38px;height:38px;flex:0 0 38px}
    .portfolio-card-title-copy{display:grid;gap:1px;min-width:0}
    .portfolio-card-title-copy strong{font-size:15px}
    .portfolio-card-title-copy small{font-size:11px;color:var(--muted)}
    .portfolio-card-balance{display:grid;gap:2px}
    .portfolio-card-balance span{font-size:11px;color:var(--muted)}
    .portfolio-card-balance strong{font-size:22px;line-height:1.35;font-variant-numeric:tabular-nums}
    .portfolio-card-foot{display:flex;align-items:end;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px}
    .portfolio-card-foot span{color:var(--muted)}
    .portfolio-card-foot strong{text-align:left;font-size:12px;font-variant-numeric:tabular-nums}
    .portfolio-total .portfolio-card-title-copy small,.portfolio-total .portfolio-card-balance span,.portfolio-total .portfolio-card-foot span{color:#d6d9dd}
    .portfolio-total .portfolio-card-foot{border-top-color:rgba(255,255,255,.2)}
    .portfolio-total .portfolio-card-foot strong{color:#fff}
    .portfolio-card[data-detail]:hover{border-color:var(--border-strong)}
    .portfolio-card[data-detail]:active{background:var(--strong)}
    .portfolio-hint{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;margin-top:2px}
    .portfolio-mix-hero{background:var(--primary);color:#fff;border-color:var(--primary)}
    .portfolio-mix-hero .muted{color:#d6d9dd}.mix-total{display:grid;gap:3px}.mix-total strong{font-size:26px;font-variant-numeric:tabular-nums}.mix-total span{font-size:12px}
    .mix-bar{height:14px;border-radius:999px;overflow:hidden;display:flex;background:rgba(255,255,255,.16);margin-top:14px}.mix-bar span{height:100%}
    .mix-card-list{display:grid;gap:8px}
    .mix-card{min-height:76px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px}
    .mix-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--text);background:var(--strong)}
    .mix-copy{display:grid;gap:2px}.mix-copy strong{font-size:14px}.mix-copy small{font-size:11px;color:var(--muted)}
    .mix-share{text-align:left;display:grid;gap:2px}.mix-share strong{font-size:15px;font-variant-numeric:tabular-nums}.mix-share span{font-size:11px;color:var(--muted)}
    .inline-status{display:inline-flex;align-items:center;min-height:28px;padding:3px 8px;border-radius:999px;background:var(--strong);font-size:12px;white-space:nowrap}
    .inline-status.success{background:var(--success-bg);color:var(--success)}
    .inline-status.warning{background:var(--warning-bg);color:var(--warning)}
    .inline-status.danger{background:var(--danger-bg);color:var(--danger)}
    .alert{display:flex;gap:10px;align-items:flex-start;background:var(--warning-bg);color:#5e4105;border:1px solid #ead59c;border-radius:var(--r-md);padding:12px;font-size:13px;margin-bottom:12px}
    .alert.danger{background:var(--danger-bg);border-color:#efc4c0;color:#6f1c16}
    .alert svg{width:20px;flex:0 0 20px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8}
    .metal-list,.activity-list{display:grid;gap:8px}
    .metal-row,.activity-row,.menu-row{width:100%;min-height:76px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:11px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right}
    .metal-row[disabled]{cursor:not-allowed;opacity:.66}
    .metal-symbol{width:44px;height:44px;border-radius:50%;background:var(--strong);border:1px solid var(--border-strong);display:grid;place-items:center;font-weight:750;font-size:14px}
    .row-main{min-width:0;display:grid;gap:2px}
    .row-main strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-main small,.row-side small{font-size:11px;color:var(--muted)}
    .row-side{text-align:left;display:grid;gap:2px;justify-items:end;font-variant-numeric:tabular-nums}
    .row-side strong{font-size:13px;white-space:nowrap}
    .positive{color:var(--success)}
    .negative{color:var(--danger)}
    .muted{color:var(--muted)}
    .wallet-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .wallet-row strong{font-size:17px;font-variant-numeric:tabular-nums}
    .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .quick-action{min-height:76px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:12px;text-align:right;display:grid;gap:3px;align-content:center}
    .quick-action strong{font-size:14px}
    .quick-action span{font-size:11px;color:var(--muted)}
    .service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .service-tile{min-width:0;min-height:132px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:13px;text-align:right;display:grid;align-content:space-between;gap:12px}
    .service-tile:hover{border-color:var(--border-strong)}
    .service-tile .service-copy{display:grid;gap:3px;min-width:0}
    .service-tile strong{font-size:14px;line-height:1.45}
    .service-tile small{font-size:11px;line-height:1.5;color:var(--muted)}
    .service-icon{width:42px;height:42px;border-radius:12px;background:var(--strong);border:1px solid var(--border);display:grid;place-items:center;color:var(--primary)}
    .service-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .feature-grid{display:grid;gap:8px}
    .feature-card{width:100%;min-height:88px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:13px;text-align:right;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
    .feature-card strong{font-size:14px}.feature-card p{margin:3px 0 0;color:var(--muted);font-size:11px}.feature-card .inline-status{align-self:start}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .choice{min-height:48px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:8px;font-size:12px}
    .choice.selected{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
    .assumption{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--r-sm);background:var(--info);color:var(--muted);font-size:12px}
    .code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--strong);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
    .code-box strong{font-variant-numeric:tabular-nums;letter-spacing:1px}
    .status-list{display:grid;gap:8px}.status-item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:9px 0;border-bottom:1px solid var(--border)}.status-item:last-child{border-bottom:0}
    .page-lead{margin-bottom:14px}
    .page-lead h3{font-size:20px;margin:0 0 4px}
    .page-lead p{margin:0;color:var(--muted);font-size:13px}
    .search{position:relative;margin-bottom:12px}
    .search input{width:100%;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0 42px 0 12px;font-size:15px}
    .search svg{position:absolute;inset-inline-start:14px;top:14px;width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8}
    .market-note{font-size:12px;color:var(--muted);margin:8px 2px 12px}
    .detail-position{display:grid;gap:10px}
    .detail-position .weight{font-size:27px;font-weight:750;font-variant-numeric:tabular-nums}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .metric{background:var(--subtle);border-radius:var(--r-sm);padding:10px;display:grid;gap:3px}
    .metric span{font-size:11px;color:var(--muted)}
    .metric strong{font-size:14px;font-variant-numeric:tabular-nums}
    .trade-selector{width:100%;min-height:62px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-md);padding:9px 12px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:right}
    .trade-selector .selector-copy{display:grid;gap:1px}
    .trade-selector .selector-copy small{font-size:11px;color:var(--muted)}
    .trade-selector .selector-copy strong{font-size:15px}
    .segment{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--strong);border-radius:var(--r-sm);padding:4px}
    .segment button{height:44px;border:0;background:transparent;border-radius:8px;font-size:13px}
    .segment button.selected{background:var(--surface);box-shadow:0 1px 3px rgba(18,23,29,.12);font-weight:700}
    .field{display:grid;gap:6px;margin-top:14px}
    .field label{font-size:13px;font-weight:650}
    .input-wrap{height:52px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-sm);display:flex;align-items:center;gap:8px;padding:0 12px}
    .input-wrap input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
    .input-wrap span{font-size:12px;color:var(--muted);white-space:nowrap}
    .field-help{font-size:11px;color:var(--muted)}
    .quote-card{margin-top:12px;background:var(--subtle);border-radius:var(--r-sm);padding:11px;display:grid;gap:4px}
    .quote-row{display:flex;justify-content:space-between;gap:12px;font-size:12px}
    .quote-row span{color:var(--muted)}
    .quote-row strong{font-variant-numeric:tabular-nums}
    .chart-asset-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .chart-asset-button{min-height:48px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;display:flex;align-items:center;gap:8px}
    .dialog-wrap{align-items:center;padding:20px}
    .dialog{width:100%;background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
    .dialog h3{font-size:18px;margin:0 0 6px}
    .dialog p{font-size:13px;color:var(--muted);margin:0 0 14px}
    .chart-card{padding:12px}
    .periods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
    .period{height:44px;border:1px solid var(--border);background:var(--surface);border-radius:9px;font-size:12px}
    .period.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
    .chart{width:100%;height:138px;display:block}
    .chart .grid{stroke:var(--border);stroke-width:1}
    .chart .line{stroke:var(--primary);stroke-width:2.4;fill:none}
    .chart text{font:10px "Yekan Bakh";fill:var(--muted)}
    .action-stack{display:grid;gap:8px;margin-top:12px}
    .primary-button,.secondary-button{min-height:48px;border-radius:var(--r-sm);font-weight:700;padding:10px 14px}
    .primary-button{border:1px solid var(--primary);background:var(--primary);color:#fff}
    .primary-button:disabled{opacity:.45;cursor:not-allowed}
    .secondary-button{border:1px solid var(--border-strong);background:var(--surface)}
    .empty{text-align:center;padding:28px 16px}
    .empty-mark{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:var(--strong);display:grid;place-items:center;font-weight:750}
    .empty h3{font-size:17px;margin:0 0 6px}
    .empty p{font-size:13px;color:var(--muted);margin:0 auto 16px;max-width:270px}
    .operation-rail{direction:rtl;display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
    .chip{flex:0 0 auto;min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:12px;scroll-snap-align:start;white-space:nowrap}
    .chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
    .filter-row{display:flex;gap:8px;margin-bottom:12px}
    .filter-control{min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;display:inline-flex;align-items:center;gap:6px;font-size:12px}
    .filter-control.hidden{display:none}
    .filter-control .count{min-width:20px;height:20px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px}
    .reset{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);font-size:12px;min-height:44px}
    .activity-row{grid-template-columns:44px minmax(0,1fr) auto;min-height:82px}
    .activity-icon{width:44px;height:44px;border-radius:12px;background:var(--strong);display:grid;place-items:center;font-size:12px;font-weight:750}
    .activity-row .row-side strong{font-size:12px}
    .activity-row .row-side small{font-size:10px}
    .receipt-head{text-align:center;padding:18px 10px 10px}
    .receipt-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--success-bg);color:var(--success);font-size:23px;font-weight:800}
    .receipt-head h3{font-size:18px;margin:0 0 4px}
    .receipt-head p{font-size:12px;color:var(--muted);margin:0}
    .receipt-grid{display:grid;margin-top:12px;border-top:1px solid var(--border)}
    .receipt-row{min-height:46px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}
    .receipt-row span{color:var(--muted)}
    .receipt-row strong{text-align:left;font-variant-numeric:tabular-nums}
    .asset-proof{display:flex;align-items:center;gap:10px;background:var(--subtle);border-radius:var(--r-sm);padding:10px;margin-top:12px}
    .asset-proof .metal-symbol{width:38px;height:38px}
    .asset-proof div{display:grid}
    .asset-proof small{color:var(--muted);font-size:11px}
    .physical-segment{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--strong);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;margin-bottom:12px}
    .physical-segment button{min-height:44px;border:0;background:transparent;border-radius:10px;font-size:13px}
    .physical-segment button.selected{background:var(--surface);box-shadow:0 1px 4px rgba(18,23,29,.14);font-weight:750}
    .physical-balance{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .physical-balance-copy{display:grid;gap:2px}.physical-balance-copy span{font-size:12px;color:var(--muted)}.physical-balance-copy strong{font-size:22px;font-variant-numeric:tabular-nums}

    document.addEventListener('click',async e=>{
      const closeButton=e.target.closest('button[data-close-sheet]');
      if(closeButton||e.target.matches('.scrim[data-close-sheet]')){closeOverlay();return}
      const t=e.target.closest('button');if(!t)return;
      if(t.dataset.scenario){setScenario(t.dataset.scenario);return}
      if(t===headerBack){back();return}
      if(t===headerAction){openOverlay(headerBack.style.visibility==='visible'?'account':'notifications',t);return}
      if(t.hasAttribute('data-auth-submit')){setScenario('home');showToast('ورود موفق بود.');return}
      if(t.hasAttribute('data-start-kyc')){navigate('kyc');return}
      if(t.hasAttribute('data-kyc-submit')){setScenario('home');showToast('احراز هویت آزمایشی تکمیل شد.');return}
      if(t.hasAttribute('data-go-home')){setScenario('home');return}
      if(t.dataset.moneyMethod){state.moneyMethod=t.dataset.moneyMethod;render();return}
      if(t.dataset.moneyDestination){state.moneyDestination=t.dataset.moneyDestination;render();return}
      if(t.hasAttribute('data-money-preview')){navigate('money-preview');return}
      if(t.hasAttribute('data-edit-money')){back();return}
      if(t.hasAttribute('data-confirm-money')){beginFeature(state.moneyMode);return}
      if(t.dataset.physicalStart){resetPhysical(t.dataset.physicalStart);navigate('physical-select');return}
      if(t.dataset.physicalTab){state.featureAsset=t.dataset.physicalTab;render();return}
      if(t.hasAttribute('data-open-physical-rules')){openOverlay('physical-rules',t);return}
      if(t.hasAttribute('data-physical-catalog')){navigate('physical-config');return}
      if(t.dataset.physicalPlus){
        const asset=state.featureAsset,sku=physicalCatalog[asset].skus.find(item=>item.id===t.dataset.physicalPlus);
        if(!sku||!physicalCanAdd(sku,asset)){showToast('موجودی شما برای اضافه‌کردن این شمش کافی نیست.');return}
        state.physicalItems[asset]??={};state.physicalItems[asset][sku.id]=Number(state.physicalItems[asset][sku.id]||0)+1;render();return;
      }
      if(t.dataset.physicalMinus){
        const asset=state.featureAsset,id=t.dataset.physicalMinus,current=Number(state.physicalItems[asset]?.[id]||0);
        if(current<=1)delete state.physicalItems[asset][id];else state.physicalItems[asset][id]=current-1;render();return;
      }
      if(t.hasAttribute('data-physical-preview')){navigate('physical-preview');return}
      if(t.hasAttribute('data-open-physical-confirm')){openOverlay('physical-confirm',t);return}
      if(t.hasAttribute('data-physical-retry')){state.scenario='physical-preview';state.stack=[];state.sheet=null;render();return}
      if(t.hasAttribute('data-physical-back')){back();return}
      if(t.hasAttribute('data-physical-request')){state.operation='physical';state.metal=state.featureAsset;state.status='all';state.date='all';state.stack=[];state.scenario='history-filtered';render();return}
      if(t.dataset.targetKind){state.targetKind=t.dataset.targetKind;state.targetPrice='';state.targetAmount='';navigate('target-setup');return}
      if(t.dataset.featureAsset){state.featureAsset=t.dataset.featureAsset;render();return}
      if(t.dataset.targetDirection){state.targetDirection=t.dataset.targetDirection;render();return}
      if(t.dataset.targetExpiry){state.targetExpiry=t.dataset.targetExpiry;render();return}
      if(t.hasAttribute('data-target-preview')){navigate('target-preview');return}
      if(t.dataset.installmentTerm){state.installmentTerm=t.dataset.installmentTerm;render();return}
      if(t.hasAttribute('data-installment-pay')){state.featureAsset='silver';navigate('installment-payment');return}
      if(t.hasAttribute('data-installment-preview')){navigate('installment-preview');return}
      if(t.dataset.giftMode){state.giftMode=t.dataset.giftMode;state.giftAmount='';state.giftRecipient='';state.giftCode='';navigate('gift-setup');return}
      if(t.dataset.giftSource){state.giftSource=t.dataset.giftSource;render();return}
      if(t.hasAttribute('data-gift-preview')){navigate('gift-preview');return}
      if(t.dataset.confirmFeature){beginFeature(t.dataset.confirmFeature);return}
      if(t.hasAttribute('data-edit-feature')){back();return}
      if(t.hasAttribute('data-open-result-receipt')){navigate('receipt');return}
      if(t.hasAttribute('data-result-history')){state.operation=state.receipt.op;state.metal=state.receipt.asset||'all';state.status='all';state.date='all';state.stack=[];state.scenario='history-filtered';render();return}
      if(t.hasAttribute('data-referral-deposits')){state.operation='deposit';state.metal='all';state.status='all';state.date='all';navigate('history-filtered');return}
      if(t.dataset.go){if(t.dataset.go==='physical-select')resetPhysical('gold');if(t.dataset.historyMetal){state.operation='all';state.metal=t.dataset.historyMetal}navigate(t.dataset.go);return}
      if(t.dataset.detail){navigate('detail-'+t.dataset.detail);return}
      if(t.dataset.tradeAsset){state.tradeAsset=t.dataset.tradeAsset;state.tradeAmount='';state.quoteActive=false;navigate('trade-gold');return}
      if(t.dataset.toast){showToast(t.dataset.toast);return}
      if(t.dataset.period){state.period=t.dataset.period;render();return}
      if(t.dataset.tradeMode){state.tradeMode=t.dataset.tradeMode;state.tradeAmount='';state.quoteActive=false;render();return}
      if(t.dataset.openFullChart){state.chartAsset=t.dataset.openFullChart;navigate('chart-single');return}
      if(t.dataset.openTradeAssets){const size=t.dataset.openTradeAssets==='16'?'16':'3';state.scenario=size==='16'?'trade-selector16':'trade-selector3';openOverlay(`trade-asset-${size}`,t);return}
      if(t.dataset.selectTradeAsset){
        if(state.quoteActive&&t.dataset.selectTradeAsset!==state.tradeAsset){state.pendingTradeAsset=t.dataset.selectTradeAsset;state.scenario='trade-quote-switch';state.sheet='quote-confirm';overlay()}
        else{state.tradeAsset=t.dataset.selectTradeAsset;state.pendingTradeAsset=null;state.sheet=null;state.scenario='trade-gold';render()}
        return;
      }
      if(t.hasAttribute('data-confirm-trade-switch')){state.tradeAsset=state.pendingTradeAsset;state.pendingTradeAsset=null;state.tradeAmount='';state.quoteActive=false;state.sheet=null;state.scenario='trade-gold';render();showToast('فلز تغییر کرد؛ مبلغ و نرخ قبلی پاک شدند.');return}
      if(t.hasAttribute('data-cancel-switch')){closeOverlay();return}
      if(t.hasAttribute('data-trade-preview')){navigate('trade-preview');return}
      if(t.hasAttribute('data-edit-trade')){back();return}
      if(t.hasAttribute('data-confirm-trade')){navigate('trade-processing');const token=state.processingToken;setTimeout(()=>{if(state.processingToken===token&&state.scenario==='trade-processing')completeTrade()},800);return}
      if(t.hasAttribute('data-open-chart-assets')){openOverlay('chart-asset',t);return}
      if(t.dataset.chartAsset){state.chartAsset=t.dataset.chartAsset;state.sheet=null;render();return}
      if(t.hasAttribute('data-trade-from-chart')){state.tradeAsset=state.chartAsset;state.tradeAmount='';state.quoteActive=false;navigate('trade-gold');return}
      if(t.dataset.operation){state.operation=t.dataset.operation;state.scenario=(state.operation==='all'&&state.metal==='all'&&state.status==='all'&&state.date==='all')?'history':'history-filtered';render();return}
      if(t.dataset.sheet){openOverlay(t.dataset.sheet,t);return}
      if(t.dataset.metal){state.metal=t.dataset.metal;state.sheet=null;state.scenario=(state.operation==='all'&&state.metal==='all'&&state.status==='all'&&state.date==='all')?'history':'history-filtered';render();return}
      if(t.dataset.draftStatus){state.draftStatus=t.dataset.draftStatus;overlay(false);return}
      if(t.dataset.draftDate){state.draftDate=t.dataset.draftDate;overlay(false);return}
      if(t.hasAttribute('data-clear-filter-draft')){state.draftStatus='all';state.draftDate='all';overlay(false);return}
      if(t.hasAttribute('data-apply-filters')){state.status=state.draftStatus;state.date=state.draftDate;state.sheet=null;state.scenario=(state.operation==='all'&&state.metal==='all'&&state.status==='all'&&state.date==='all')?'history':'history-filtered';render();showToast('فیلترها اعمال شدند.');return}
      if(t.hasAttribute('data-reset')){state.metal='all';state.status='all';state.date='all';state.scenario='history';render();return}
      if(t.dataset.receipt){state.receipt=activities.find(a=>a.id===t.dataset.receipt);navigate('receipt');return}
      if(t.hasAttribute('data-back-history')){state.operation=state.receipt.op;state.metal=state.receipt.asset||'all';state.status='all';state.date='all';state.stack=[];state.scenario='history-filtered';render();appMain.scrollTop=0;return}
      if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy)}catch{}showToast('کد پیگیری کپی شد.');return}
      if(t.dataset.nav==='خانه'){setScenario('home');return}
      if(t.dataset.nav==='معامله'){state.scenario='trade-gold';state.stack=[];state.sheet=null;state.tradeAmount='';state.quoteActive=false;render();appMain.scrollTop=0;return}
      if(t.dataset.nav==='خدمات'){state.scenario='services';state.stack=[];state.sheet=null;render();appMain.scrollTop=0;return}
    });
    document.addEventListener('input',e=>{
      if(e.target.id==='market-search'){
        const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#market-list [data-search]').forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(q));return;
      }
      if(e.target.id==='trade-asset-search'){
        const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#trade-asset-list [data-search]').forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(q));return;
      }
      const fieldMap={
        'auth-mobile':'authMobile','auth-password':'authPassword','kyc-national':'kycNationalId','kyc-birth':'kycBirth','money-amount':'moneyAmount','target-price':'targetPrice','target-amount':'targetAmount','installment-amount':'installmentAmount','gift-amount':'giftAmount','gift-recipient':'giftRecipient','gift-code':'giftCode'
      };
      if(fieldMap[e.target.id]){
        const id=e.target.id,value=e.target.value,scrollTop=appMain.scrollTop;state[fieldMap[id]]=value;render();
        requestAnimationFrame(()=>{appMain.scrollTop=scrollTop;const input=document.getElementById(id);if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}});return;
      }
      if(e.target.id==='trade-amount'){
        const value=e.target.value;state.tradeAmount=value;state.quoteActive=value.trim().length>0;render();
        requestAnimationFrame(()=>{const input=document.getElementById('trade-amount');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}});
      }
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&state.sheet){closeOverlay();return}
      if(e.key==='Tab'&&state.sheet){
        const focusable=[...overlayRoot.querySelectorAll('button:not([disabled]),input:not([disabled])')];if(!focusable.length)return;
        const first=focusable[0],last=focusable[focusable.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
      }
    });
    render();
  </script>
</body>
</html>
