<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>وایرفریم سرتاسری چندفلزی شمش — MM-W0 تا MM-W8</title>
  <style>
    @font-face {
      font-family: "Yekan Bakh";
      src: url("../../07-design-system/legacy-brand/typogaphy/YekanBakh3%20-%20Pro%20%20Plus/Yekan%20Bakh%20Variable/webfonts/YekanBakhFaNum-VF.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --canvas:#eef0f2; --surface:#fff; --subtle:#f6f7f8; --strong:#eceff1;
      --text:#17191c; --muted:#626870; --border:#d6dae0; --border-strong:#aeb4bc;
      --primary:#1d2530; --primary-pressed:#0e1217; --focus:#1d64d8;
      --danger:#a92820; --danger-bg:#fff1f0; --warning:#815600; --warning-bg:#fff8e7;
      --success:#176b47; --success-bg:#edf8f2; --info:#eef3f7;
      --wallet-surface:#f3f7fa; --wallet-border:#bdccd8; --wallet-accent:#315d7a;
      --gold-accent:#c49a43; --silver-accent:#8e9ba8; --copper-accent:#ad693b;
      --r-sm:10px; --r-md:14px; --r-lg:18px; --shadow:0 18px 60px rgba(26,31,38,.13);
      font-family:"Yekan Bakh",Tahoma,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--canvas)}
    body{margin:0;min-width:320px;min-height:100dvh;background:var(--canvas);color:var(--text);font:16px/1.55 inherit}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent);outline-offset:2px}
    button:active{opacity:.76}
    .skip{position:fixed;inset-inline-start:12px;top:-60px;z-index:1000;background:var(--primary);color:#fff;padding:10px 14px;border-radius:8px}
    .skip:focus{top:12px}
    .workspace{direction:ltr;min-height:100dvh;display:grid;grid-template-columns:minmax(260px,320px) 390px;justify-content:center;align-items:start;gap:28px;padding:28px}
    .review-panel,.phone{direction:rtl;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
    .review-panel{position:sticky;top:28px;border-radius:var(--r-lg);padding:20px;max-height:calc(100dvh - 56px);overflow:auto}
    .review-panel h1{font-size:21px;line-height:1.4;margin:0 0 6px}
    .review-panel p{font-size:13px;color:var(--muted);margin:0 0 16px}
    .wave-label{display:inline-flex;min-height:28px;align-items:center;padding:2px 9px;background:var(--strong);border-radius:999px;font-size:12px;margin-bottom:10px}
    .scenario-list{display:grid;gap:8px}
    .scenario{min-height:48px;text-align:right;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center}
    .scenario span{font-size:12px;color:var(--muted);direction:ltr;text-align:left}
    .scenario strong{font-size:13px;font-weight:650}
    .scenario.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .scenario.active span{color:#d7dbe0}
    .legend{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
    .phone{--app-chrome-top:84px;width:390px;height:820px;border-radius:28px;overflow:hidden;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
    .statusbar{height:26px;background:var(--surface);display:flex;align-items:end;justify-content:space-between;padding:0 18px 3px;font-size:10px;direction:ltr}
    .app-header{min-height:58px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:48px 1fr 48px;grid-template-areas:"left title right";align-items:center;padding:0 10px;background:var(--surface);z-index:10;direction:ltr}
    .app-header h2{grid-area:title;direction:rtl;font-size:18px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #header-left{grid-area:left}
    #header-right{grid-area:right}
    .icon-button{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px}
    .icon-button svg,.nav-item svg,.row-chevron svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .app-main{overflow-y:auto;overscroll-behavior:contain;background:var(--subtle);padding:16px 16px 28px;scrollbar-width:thin}
    .app-main.trade-compact{overflow:hidden;padding:0;display:flex;flex-direction:column;background:var(--surface);scrollbar-width:none;-ms-overflow-style:none}
    .app-main.trade-compact::-webkit-scrollbar{display:none}
    .app-main.home-scrollless{scrollbar-width:none;-ms-overflow-style:none}
    .app-main.home-scrollless::-webkit-scrollbar{display:none}
    .app-main:has(> .live-price-ticker){padding-top:7px}
    .app-main:has(> .sticky-action){display:flex;flex-direction:column;padding-bottom:0}
    .bottom-nav{min-height:74px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom));z-index:10}
    .bottom-nav.hidden{display:none}
    .nav-item{min-height:56px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;border-radius:12px}
    .nav-item.active{color:var(--text);background:var(--strong);font-weight:650}
    .section{margin-top:16px}
    .section:first-child{margin-top:0}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .section-head h3{font-size:15px;margin:0}
    .text-button{min-height:44px;border:0;background:transparent;padding:6px;color:var(--primary);font-weight:650}
    .live-price-ticker{direction:rtl;width:100%;min-height:46px;margin:0 0 12px;padding:0 10px;border:0;border-radius:8px;background:var(--strong);color:var(--text);display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:12px;text-align:right;overflow:hidden}
    button.live-price-ticker{cursor:pointer}
    .live-price-label{font-size:10px;color:var(--muted);white-space:nowrap}
    .live-price-window{direction:ltr;height:38px;overflow:hidden;min-width:0}
    .live-price-track{height:38px;transform:translateY(0);will-change:transform}
    .live-price-ticker.is-preparing .live-price-track{transform:translateY(-38px)}
    .live-price-ticker.is-shifting .live-price-track{transform:translateY(0);transition:transform 360ms cubic-bezier(.22,1,.36,1)}
    .live-price-row{direction:rtl;height:38px;display:flex;align-items:center;justify-content:flex-start;gap:6px;white-space:nowrap}
    .live-price-row strong{direction:ltr;font-size:15px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
    .live-price-row span{font-size:12px;font-weight:650}
    .live-price-row small{font-size:10px;color:var(--muted)}
    .live-price-row.unavailable strong{direction:rtl;font-size:12px;color:var(--muted)}
    @media (hover:hover) and (pointer:fine){button.live-price-ticker:hover{background:color-mix(in srgb,var(--strong) 48%,transparent)}}
    @media (prefers-reduced-motion:reduce){.live-price-ticker.is-preparing .live-price-track,.live-price-ticker.is-shifting .live-price-track{transform:none;transition:none}}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
    .summary-card{background:var(--primary);color:#fff;border-color:var(--primary);padding:18px}
    .summary-label{font-size:12px;color:#d6d9dd}
    .summary-value{font-size:25px;font-weight:750;line-height:1.4;margin:4px 0;font-variant-numeric:tabular-nums}
    .summary-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#e9ebed}
    .summary-meta strong{color:#fff}
    .portfolio-rail{direction:rtl;display:flex;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none}
    .portfolio-rail::-webkit-scrollbar{display:none}
    .portfolio-card{position:relative;flex:0 0 calc(100% - 104px);min-height:98px;scroll-snap-align:start;scroll-snap-stop:always;border:1px solid var(--border);border-radius:var(--r-md);text-align:right;background:var(--surface)}
    .portfolio-card-main{width:100%;min-height:96px;border:0;background:transparent;color:inherit;text-align:right;padding:10px 12px;display:grid;align-content:space-between;gap:8px;border-radius:inherit;cursor:pointer}
    .portfolio-total{background:var(--primary);border-color:var(--primary);color:#fff}
    .portfolio-total .balance-toggle{color:#fff}
    .portfolio-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
    .portfolio-card-title-copy{display:grid;gap:1px;min-width:0}
    .portfolio-card-title-copy strong{font-size:14px}
    .portfolio-card-title-copy small{font-size:10px;color:var(--muted)}
    .portfolio-card-meta{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}
    .portfolio-card-pnl{font-size:11px;line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap;display:grid;gap:1px}
    .portfolio-card-pnl>small{font-size:9px;color:var(--muted);font-weight:500}
    .portfolio-card-pnl-value{display:flex;align-items:center;gap:4px;font-weight:700}
    .portfolio-card-pnl-value svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px}
    .portfolio-card-pnl{text-align:left;justify-items:end}
    .portfolio-card-balance{display:grid;gap:1px}
    .portfolio-card-balance>span{font-size:10px;color:var(--muted)}
    .portfolio-card-balance strong{width:max-content;max-width:calc(100% - 36px);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:4px}
    .balance-unit{font-size:1em;font-weight:inherit;color:inherit}
    .balance-unit.gram{font-size:.72em;font-weight:650}
    .portfolio-total .balance-unit{color:#d6d9dd}
    .portfolio-card-value{width:max-content;max-width:100%;font-size:13px;color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
    .balance-toggle{position:absolute;left:10px;bottom:10px;z-index:2;width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);cursor:pointer}
    .portfolio-card .balance-toggle{left:auto;right:calc(12px + var(--balance-width, 0px) + 4px);top:calc(var(--balance-top, 58px) + (var(--balance-height, 23px) - 32px)/2);bottom:auto}
    .balance-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .balance-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .secret-value{letter-spacing:2px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .portfolio-card .inline-status{min-height:24px;padding:2px 7px;font-size:10px}
    .portfolio-total .portfolio-card-title-copy small,.portfolio-total .portfolio-card-balance span{color:#d6d9dd}
    .portfolio-card:hover{border-color:var(--border-strong)}
    .portfolio-card:active{background:var(--strong)}
    .home-card-variant .portfolio-card{position:relative;overflow:hidden;border-radius:14px;border-color:var(--border);box-shadow:0 3px 10px rgba(27,35,45,.055)}
    .home-card-variant .portfolio-total{box-shadow:0 7px 18px rgba(29,37,48,.17)}
    .home-monochrome .portfolio-card .positive,.home-monochrome .portfolio-card .negative{color:var(--text)}
    .home-monochrome .portfolio-card .inline-status,.home-monochrome .portfolio-card .inline-status.success,.home-monochrome .portfolio-card .inline-status.warning,.home-monochrome .portfolio-card .inline-status.danger{background:var(--strong);color:var(--text)}
    .home-trade-cta{width:100%;min-height:44px;margin-top:4px;padding-block:7px;font-size:13px}
    .home-monochrome .alert,.home-monochrome .alert.danger{background:var(--strong);color:var(--text);border-color:var(--border-strong)}
    .portfolio-hint{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;margin-top:2px}
    .portfolio-mix-hero{background:var(--primary);color:#fff;border-color:var(--primary);display:grid;gap:10px;padding:13px 14px}
    .portfolio-mix-hero .muted{color:#d6d9dd}.mix-total{display:grid;gap:2px}.mix-total strong{font-size:20px;font-variant-numeric:tabular-nums}.mix-total span{font-size:11px}
    .mix-chart-layout{display:grid;place-items:center}
    .mix-donut-wrap{width:122px;aspect-ratio:1;position:relative;display:grid;place-items:center;cursor:pointer}
    .mix-donut{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#17191c 0 69.5%,#626870 69.5% 90.9%,#aeb4bc 90.9% 97%,#eceff1 97% 100%);box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .mix-donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--primary);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
    .mix-donut-center{position:relative;z-index:1;display:grid;text-align:center;line-height:1.2}.mix-donut-center strong{font-size:15px}.mix-donut-center span{font-size:9px;color:#d6d9dd}
    .mix-card-list{display:grid;gap:8px}
    .mix-card{min-height:76px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;transition:background-color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
    .mix-card.is-chart-hovered{background:var(--strong);border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 20px rgba(25,35,47,.12)}
    .mix-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--text);background:var(--strong)}
    .mix-copy{display:grid;gap:2px}.mix-copy strong{font-size:14px}.mix-copy small{font-size:11px;color:var(--muted)}
    .mix-share{text-align:left;display:grid;gap:2px}.mix-share strong{font-size:15px;font-variant-numeric:tabular-nums}.mix-share span{font-size:11px;color:var(--muted)}
    .inline-status{display:inline-flex;align-items:center;min-height:28px;padding:3px 8px;border-radius:999px;background:var(--strong);font-size:12px;white-space:nowrap}
    .inline-status.success{background:var(--success-bg);color:var(--success)}
    .inline-status.warning{background:var(--warning-bg);color:var(--warning)}
    .inline-status.danger{background:var(--danger-bg);color:var(--danger)}
    .alert{display:flex;gap:10px;align-items:flex-start;background:var(--warning-bg);color:#5e4105;border:1px solid #ead59c;border-radius:var(--r-md);padding:12px;font-size:13px;margin-bottom:12px}
    .alert.danger{background:var(--danger-bg);border-color:#efc4c0;color:#6f1c16}
    .alert svg{width:20px;flex:0 0 20px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8}
    .metal-list,.activity-list{display:grid;gap:8px}
    .metal-row,.activity-row,.menu-row{width:100%;min-height:76px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:11px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right}
    .profile-hero{padding:16px}
    .profile-copy{min-width:0;display:grid;gap:8px}.profile-copy>strong{font-size:18px}
    .profile-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.profile-meta small{color:var(--muted);font-size:12px}
    .profile-group{margin-top:12px}
    .profile-menu{overflow:hidden;padding:0}.profile-menu .profile-row+.profile-row{border-top:1px solid var(--border)}
    .profile-row{width:100%;min-height:64px;border:0;background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right}
    .profile-row-icon{width:40px;height:40px;border-radius:11px;background:var(--strong);display:grid;place-items:center;color:var(--primary)}
    .profile-row-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .profile-row-copy{display:grid;min-width:0}.profile-row-copy strong{font-size:14px}
    .profile-row-end{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.profile-row-end svg{width:18px;height:18px}
    .logout-button{width:100%;min-height:52px;border:1px solid #efc4c0;background:var(--danger-bg);color:var(--danger);border-radius:var(--r-md);font-weight:700;margin-top:18px}
    .setting-row{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border)}.setting-row:last-child{border-bottom:0}
    .setting-row-copy{display:grid;gap:2px}.setting-row-copy strong{font-size:13px}.setting-row-copy small{font-size:11px;color:var(--muted)}
    .toggle{direction:ltr;width:50px;height:30px;border:0;border-radius:999px;background:var(--border-strong);padding:3px;display:flex;justify-content:flex-start;transition:background .2s ease}
    .toggle::after{content:"";width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .2s ease}
    .toggle[aria-pressed="true"]{background:var(--success)}.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
    .bank-card-list{display:grid;gap:12px}
    .bank-card{min-height:172px;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#263343,#111821);display:grid;align-content:space-between;box-shadow:0 10px 28px rgba(18,24,32,.16)}
    .bank-card.alt{background:linear-gradient(135deg,#48525e,#202832)}
    .bank-card-head,.bank-card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .bank-logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.96);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:800}
    .bank-card-number{direction:ltr;text-align:center;font-size:19px;letter-spacing:2px;font-variant-numeric:tabular-nums}
    .bank-card small{color:#e1e5e9}.bank-card-foot strong{font-size:13px}
    .card-preview-empty{border:1px dashed var(--border-strong);background:var(--strong);color:var(--muted);box-shadow:none}
    .license-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .license-card{min-height:182px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);overflow:hidden;display:grid;grid-template-rows:112px auto}
    .license-image{background:linear-gradient(145deg,#eef1f4,#dfe4e9);display:grid;place-items:center;color:var(--muted)}.license-image svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.4}
    .license-copy{padding:10px;display:grid;gap:2px}.license-copy strong{font-size:13px}.license-copy small{font-size:10px;color:var(--muted)}
    .legal-article{display:grid;gap:14px}.legal-article h3{font-size:15px;margin:0}.legal-article p,.legal-article li{font-size:13px;color:var(--muted);line-height:1.75}.legal-article p{margin:0}.legal-article ol{margin:0;padding-inline-start:20px;display:grid;gap:8px}
    .summary-card .code-box{background:#fff;color:var(--text);border:1px solid rgba(255,255,255,.75)}
    .summary-card .code-box .secondary-button{background:var(--strong);color:var(--text);border-color:var(--border-strong)}
    .metal-row[disabled]{cursor:not-allowed;opacity:.66}
    .metal-symbol{width:44px;height:44px;border-radius:50%;background:var(--strong);border:1px solid var(--border-strong);display:grid;place-items:center;font-weight:750;font-size:14px}
    .row-main{min-width:0;display:grid;gap:2px}
    .row-main strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-main small,.row-side small{font-size:11px;color:var(--muted)}
    .row-side{text-align:left;display:grid;gap:2px;justify-items:end;font-variant-numeric:tabular-nums}
    .row-side strong{font-size:13px;white-space:nowrap}
    .positive{color:var(--success)}
    .negative{color:var(--danger)}
    .muted{color:var(--muted)}
    .wallet-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .wallet-row strong{font-size:17px;font-variant-numeric:tabular-nums}
    .wallet-balance-card{position:relative;overflow:hidden;width:100%;min-height:82px;border:1px solid var(--wallet-border);border-radius:16px;background:var(--wallet-surface);box-shadow:0 5px 14px rgba(49,93,122,.07);text-align:right}
    .wallet-balance-card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--wallet-accent)}
    .wallet-balance-card .balance-toggle{left:auto;right:calc(62px + var(--wallet-balance-width, 0px) + 4px);top:calc(var(--wallet-balance-top, 40px) + (var(--wallet-balance-height, 22px) - 32px)/2);bottom:auto;transform:none}

        return;
      }
      if(e.key==='Escape'&&state.sheet){closeOverlay();return}
      if(e.key==='Tab'&&state.sheet){
        const focusable=[...overlayRoot.querySelectorAll('button:not([disabled]),input:not([disabled])')];if(!focusable.length)return;
        const first=focusable[0],last=focusable[focusable.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
      }
    });
    render();
  </script>
</body>
</html>
