<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>جزئیات خرید طلا — پایلوت مستقل شمش</title>
  <style>
    @font-face {
      font-family: "Yekan Bakh";
      src: url("../../07-design-system/legacy-brand/typogaphy/YekanBakh3%20-%20Pro%20%20Plus/Yekan%20Bakh%20Variable/webfonts/YekanBakhFaNum-VF.woff2") format("woff2");
      font-weight: 100 1000;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --surface-canvas: #f5f6f7;
      --surface-base: #ffffff;
      --surface-subtle: #f5f6f7;
      --text-primary: #181a20;
      --text-secondary: #707a8a;
      --text-tertiary: #929aa5;
      --border-subtle: #eaecef;
      --interactive: #181a20;
      --interactive-pressed: #30343b;
      --on-interactive: #ffffff;
      --success: #087d52;
      --success-surface: #e9f7f1;
      --focus: #3b82f6;
      --radius-control: 12px;
      --radius-container: 16px;
      --content-gutter: 20px;
      --app-width: 430px;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      direction: ltr;
      background: var(--surface-canvas);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      direction: rtl;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--surface-canvas);
      color: var(--text-primary);
      font-family: "Yekan Bakh", Tahoma, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: var(--app-width);
      min-height: 100dvh;
      margin-inline: auto;
      background: var(--surface-base);
    }

    .app-bar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      min-height: calc(var(--header-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 12px 0;
      background: rgb(255 255 255 / 96%);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(12px);
    }

    .app-bar__title {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      font-weight: 600;
      line-height: 28px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-bar__slot {
      width: 48px;
      height: 48px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-control);
      color: var(--text-primary);
      transition: background-color 160ms ease-out;
    }

    .icon-button:hover {
      background: var(--surface-subtle);
    }

    .icon-button:active {
      background: var(--border-subtle);
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    main {
      padding: 20px var(--content-gutter) calc(124px + env(safe-area-inset-bottom));
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .result-summary {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 0 32px;
      text-align: center;
    }

    .result-summary__eyebrow {
      margin: 0 0 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      line-height: 24px;
    }

    .result-summary__amount {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin: 0;
      direction: rtl;
      color: var(--text-primary);
    }

    .result-summary__number {
      direction: ltr;
      font-size: clamp(32px, 9vw, 40px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .result-summary__unit {
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      gap: 6px;
      margin-top: 16px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--success-surface);
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
      line-height: 20px;
    }

    .status svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .result-summary__effect {
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
      line-height: 24px;
    }

    .details {
      border-top: 1px solid var(--border-subtle);
    }

    .details__title {
      margin: 0;
      padding: 24px 0 8px;
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
    }

    .detail-list {
      margin: 0;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      align-items: center;
      min-height: 56px;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-row dt,
    .detail-row dd {
      margin: 0;
    }

    .detail-row dt {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
    }

    .detail-row dd {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      line-height: 24px;
      text-align: left;
    }

    .detail-row dd[data-numeric] {
      direction: rtl;
      font-variant-numeric: tabular-nums;
      unicode-bidi: isolate;
    }

    .detail-row dd[data-code] {
      direction: ltr;
      font-family: "Yekan Bakh", Tahoma, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.02em;
      unicode-bidi: isolate;
    }

    .bottom-actions {
      position: fixed;
      z-index: 30;
      right: max(0px, calc((100vw - var(--app-width)) / 2));
      bottom: 0;
      left: max(0px, calc((100vw - var(--app-width)) / 2));
      display: grid;
      gap: 8px;
      padding: 12px var(--content-gutter) calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #ffffff 76%, rgb(255 255 255 / 0%));
    }

    .primary-action,
    .secondary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: var(--radius-control);
      font-size: 15px;
      font-weight: 600;
      line-height: 24px;
      transition: background-color 160ms ease-out, color 160ms ease-out;
    }

    .primary-action {
      background: var(--interactive);
      color: var(--on-interactive);
    }

    .primary-action:hover {
      background: var(--interactive-pressed);
    }

    .primary-action:active {
      background: #000000;
    }

    .secondary-action {
      min-height: 44px;
      color: var(--text-secondary);
    }

    .secondary-action:hover,
    .secondary-action:active {
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 70%, white);
      outline-offset: 2px;
    }

    @media (max-width: 359px) {
      :root {
        --content-gutter: 16px;
      }

      main {
        padding-top: 12px;
      }

      .result-summary {
        padding-block: 24px 28px;
      }

      .detail-row {
        gap: 10px;
      }

      .detail-row dt {
        font-size: 13px;
      }

      .detail-row dd {
        font-size: 14px;
      }
    }

    @media (min-width: 431px) {
      .app-shell {
        box-shadow: 0 0 0 1px rgb(24 26 32 / 6%), 0 20px 60px rgb(24 26 32 / 8%);
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      main {
        padding-top: 8px;
      }

      .result-summary {
        padding-block: 12px 20px;
      }

      .result-summary__effect {
        margin-top: 8px;
      }

      .details__title {
        padding-top: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (forced-colors: active) {
      .status,
      .primary-action {
        border: 1px solid CanvasText;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-bar" aria-label="نوار بالای صفحه">
      <a class="icon-button" href="multi-metal-waves-1-and-3-wireframe.html?scenario=home" aria-label="بازگشت به خانه">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </a>
      <p class="app-bar__title">جزئیات خرید</p>
      <span class="app-bar__slot" aria-hidden="true"></span>
    </header>

    <main id="main-content">
      <h1 class="sr-only">خرید موفق طلا</h1>

      <section class="result-summary" aria-labelledby="purchase-amount-label">
        <p class="result-summary__eyebrow" id="purchase-amount-label">طلای خریداری‌شده</p>
        <p class="result-summary__amount" aria-label="یک ممیز سیصد و نه گرم">
          <span class="result-summary__number">۱٫۳۰۹</span>
          <span class="result-summary__unit">گرم</span>
        </p>
        <span class="status" role="status">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6.5 12.5 3.5 3.5 7.5-8"></path>
          </svg>
          تکمیل‌شده
        </span>
        <p class="result-summary__effect">به دارایی طلای شما اضافه شد</p>
      </section>

      <section class="details" aria-labelledby="transaction-details-title">
        <h2 class="details__title" id="transaction-details-title">جزئیات معامله</h2>
        <dl class="detail-list">
          <div class="detail-row">
            <dt>نوع عملیات</dt>
            <dd>خرید طلا</dd>
          </div>
          <div class="detail-row">
            <dt>مبلغ پرداخت‌شده</dt>
            <dd data-numeric>۲۵٬۰۰۰٬۰۰۰ تومان</dd>
          </div>
          <div class="detail-row">
            <dt>نرخ ثبت‌شده</dt>
            <dd data-numeric>۱۹٬۱۰۰٬۰۰۰ تومان / گرم</dd>
          </div>
          <div class="detail-row">
            <dt>روش پرداخت</dt>
            <dd>درگاه بانکی</dd>
          </div>
          <div class="detail-row">
            <dt>زمان ثبت</dt>
            <dd>همین حالا</dd>
          </div>
          <div class="detail-row">
            <dt>کد پیگیری</dt>
            <dd data-code>SH-AU-248051</dd>
          </div>
        </dl>
      </section>
    </main>

    <nav class="bottom-actions" aria-label="اقدام‌های نتیجه خرید">
      <a class="primary-action" href="multi-metal-waves-1-and-3-wireframe.html?scenario=detail-gold">مشاهده دارایی طلا</a>
      <a class="secondary-action" href="multi-metal-waves-1-and-3-wireframe.html?scenario=home">بازگشت به خانه</a>
    </nav>
  </div>
</body>
</html>
